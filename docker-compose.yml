services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: simona-app
    container_name: simona_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_ENV: local
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-simona_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker-compose/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - ./docker-compose/nginx/app.conf:/etc/nginx/http.d/default.conf
    networks:
      - simona_network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && php-fpm -t || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  db:
    image: postgres:15-alpine
    container_name: simona_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-simona_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - simonadbdata:/var/lib/postgresql/data
    networks:
      - simona_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-simona_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

networks:
  simona_network:
    driver: bridge

volumes:
  simonadbdata:
    driver: local